<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de Inventario | Deportes California</title>
    <link rel="icon" href="img/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dashboard-body" data-nav="inventario">
    <main class="container-fluid p-3 p-md-4 dashboard-content">
        <div class="dash-banner mb-4">Gestión de inventario</div>

        <div class="row g-3 mb-4 align-items-center">
            <div class="col-12 col-sm-6 col-md-4">
                <div class="custom-input-pill d-flex align-items-center">
                    <input type="text" id="inputBuscar" placeholder="Buscar..." class="form-control border-0 bg-transparent shadow-none">
                    <i class="bi bi-search ms-2 text-muted fs-5"></i>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-md-4">
                <div class="custom-input-pill">
                    <select id="selectCategoria" class="form-select border-0 bg-transparent shadow-none">
                        <option value="" selected>Categoría</option>
                    </select>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-md-4">
                <a href="producto-form.html" class="btn btn-action-green w-100 fw-bold">Añadir nuevo producto</a>
            </div>
        </div>

        <div class="table-card p-2 p-md-3">
            <div class="table-responsive">
                <table class="table align-middle text-center mb-0 custom-inv-table tabla-apilada">
                    <thead>
                        <tr>
                            <th>Imagen</th><th>Código (SKU)</th><th>Producto</th><th>Categoría</th>
                            <th>Talla</th><th>Color</th><th>Precio</th><th>Stock</th><th></th>
                        </tr>
                    </thead>
                    <tbody id="tablaProductos">
                        <tr><td colspan="9" class="text-muted py-4">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/inventario.js"></script>
</body>
</html>
