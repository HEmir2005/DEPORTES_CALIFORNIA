<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirmar venta | Deportes California</title>
    <link rel="icon" href="img/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dashboard-body" data-nav="ventas">
    <main class="container-fluid p-3 p-md-4 dashboard-content">
        <div class="form-card">
            <h1 class="h3 fw-bold mb-3">Resumen de compra</h1>
            <div class="row g-4">
                <div class="col-12 col-lg-8">
                    <div class="table-responsive">
                        <table class="table align-middle text-center mb-0 custom-inv-table tabla-apilada">
                            <thead><tr><th>Imagen</th><th class="text-start">Producto</th><th>Cant.</th><th>Precio</th><th>Subtotal</th></tr></thead>
                            <tbody id="tablaResumen"></tbody>
                        </table>
                    </div>
                    <a href="registrar-venta.html" class="btn btn-outline-dark rounded-pill mt-3"><i class="bi bi-arrow-left"></i> Modificar carrito</a>
                </div>

                <div class="col-12 col-lg-4 d-flex flex-column gap-3">
                    <div class="total-box"><div>Total a pagar</div><div class="monto" id="totalPagar">$0.00</div></div>
                    <div class="row g-2">
                        <div class="col-6"><button type="button" class="pay-btn transferencia" data-metodo="TRANSFERENCIA"><i class="bi bi-phone"></i>Transferencia</button></div>
                        <div class="col-6"><button type="button" class="pay-btn efectivo" data-metodo="EFECTIVO"><i class="bi bi-cash-stack"></i>Efectivo</button></div>
                    </div>
                    <button type="button" id="btnConfirmar" class="btn btn-pill btn-blue py-3">Confirmar venta</button>
                </div>
            </div>
        </div>

        <div class="modal fade" id="modalExito" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-3 border-dark rounded-4 text-center p-3">
                    <i class="bi bi-check-circle-fill text-success" style="font-size:3.5rem"></i>
                    <h2 class="h4 fw-bold">Venta registrada</h2>
                    <p class="mb-1">Folio <b id="folio"></b></p>
                    <p>Total cobrado: <b id="totalFinal"></b></p>
                    <div class="d-flex justify-content-center gap-2">
                        <a href="registrar-venta.html" class="btn btn-pill btn-green">Nueva venta</a>
                        <a href="index.html" class="btn btn-pill btn-blue">Ir al inicio</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/confirmar.js"></script>
</body>
</html>
