<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalles del producto | Deportes California</title>
    <link rel="icon" href="img/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dashboard-body" data-nav="inventario">
    <main class="container-fluid p-3 p-md-4 dashboard-content">
        <div class="dash-banner mb-4">Detalle del producto</div>

        <div class="form-card">
            <div class="row g-4">
                <div class="col-12 col-md-5">
                    <div id="dImagen" class="detail-foto"></div>
                </div>

                <div class="col-12 col-md-7">
                    <h2 class="producto-nombre" id="dNombre"></h2>

                    <div class="d-flex flex-wrap align-items-end gap-4 mb-3">
                        <div>
                            <small class="text-muted d-block">Precio</small>
                            <span class="producto-precio" id="dPrecio"></span>
                        </div>
                        <div>
                            <small class="text-muted d-block">Stock actual</small>
                            <span class="producto-stock" id="dStock"></span>
                            <small class="text-muted">unidades</small>
                            <span class="badge text-bg-danger ms-1" id="dAvisoStock"></span>
                        </div>
                    </div>

                    <dl class="row producto-datos mb-3">
                        <dt class="col-5 col-sm-4">Código (SKU)</dt><dd class="col-7 col-sm-8" id="dSku"></dd>
                        <dt class="col-5 col-sm-4">Categoría</dt><dd class="col-7 col-sm-8" id="dCategoria"></dd>
                        <dt class="col-5 col-sm-4">Talla</dt><dd class="col-7 col-sm-8" id="dTalla"></dd>
                        <dt class="col-5 col-sm-4">Color</dt><dd class="col-7 col-sm-8" id="dColor"></dd>
                    </dl>

                    <h3 class="h6 fw-bold">Descripción</h3>
                    <p id="dDescripcion" class="mb-4"></p>

                    <div class="d-flex flex-wrap gap-2">
                        <button type="button" id="btnEntrada" class="btn btn-pill btn-green"><i class="bi bi-box-arrow-in-down"></i> Entrada</button>
                        <button type="button" id="btnSalida" class="btn btn-pill btn-red"><i class="bi bi-box-arrow-up"></i> Salida</button>
                        <a id="btnEditar" href="#" class="btn btn-pill btn-blue"><i class="bi bi-pencil"></i> Editar</a>
                        <a href="inventario.html" class="btn btn-outline-dark">Volver</a>
                    </div>
                </div>
            </div>

            <hr class="my-4">

            <h3 class="h5 fw-bold mb-3">Historial de movimientos</h3>
            <div class="table-responsive border rounded-3">
                <table class="table table-sm mb-0 align-middle">
                    <thead class="table-light"><tr><th>Fecha</th><th>Movimiento</th><th class="text-end">Cant.</th><th class="text-end">Stock</th><th>Usuario</th></tr></thead>
                    <tbody id="tablaMov"></tbody>
                </table>
            </div>
            <div id="paginacionMov"></div>
        </div>

        <div class="modal fade" id="modalMov" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-sm">
                <div class="modal-content border-3 border-dark rounded-4">
                    <div class="modal-header"><h5 class="modal-title fw-bold" id="tituloMov"></h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
                    <div class="modal-body">
                        <label class="field-label" for="cantidadMov">Cantidad de unidades</label>
                        <input type="number" id="cantidadMov" class="form-control pill-field" min="1" step="1" inputmode="numeric">
                        <div class="invalid-feedback"></div>
                        <div class="form-text" id="stockMov"></div>
                    </div>
                    <div class="modal-footer"><button type="button" id="btnGuardarMov" class="btn btn-pill btn-green">Guardar</button></div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/detalle.js"></script>
</body>
</html>
