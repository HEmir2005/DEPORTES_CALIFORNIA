<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalles del producto | Deportes California</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dashboard-body" data-nav="inventario">
    <main class="container-fluid p-3 p-md-4 dashboard-content">
        <div class="dash-banner mb-4">DETALLES DEL PRODUCTO</div>

        <div class="form-card">
            <div class="row g-4">
                <div class="col-12 col-md-4 text-center">
                    <div id="dImagen"></div>
                    <h2 class="h4 fw-bold mt-3" id="dNombre"></h2>
                </div>
                <div class="col-12 col-md-8">
                    <div class="row g-3 mb-3">
                        <div class="col-6 col-lg-4"><small class="text-muted d-block">SKU / Código</small><b id="dSku"></b></div>
                        <div class="col-6 col-lg-4"><small class="text-muted d-block">Categoría</small><b id="dCategoria"></b></div>
                        <div class="col-6 col-lg-4"><small class="text-muted d-block">Precio</small><b id="dPrecio"></b></div>
                        <div class="col-6 col-lg-4"><small class="text-muted d-block">Talla</small><b id="dTalla"></b></div>
                        <div class="col-6 col-lg-4"><small class="text-muted d-block">Color</small><b id="dColor"></b></div>
                        <div class="col-6 col-lg-4"><small class="text-muted d-block">Stock actual</small><b class="fs-5" id="dStock"></b></div>
                    </div>
                    <p id="dDescripcion" class="mb-4"></p>

                    <h3 class="h6 fw-bold">Historial de movimientos</h3>
                    <div class="table-responsive border border-2 border-dark rounded-3 mb-3" style="max-height:260px">
                        <table class="table table-sm mb-0 align-middle">
                            <thead class="table-light"><tr><th>Fecha</th><th>Movimiento</th><th class="text-end">Cant.</th><th class="text-end">Stock</th></tr></thead>
                            <tbody id="tablaMov"></tbody>
                        </table>
                    </div>

                    <div class="d-flex flex-wrap gap-2">
                        <button type="button" id="btnEntrada" class="btn btn-pill btn-green"><i class="bi bi-box-arrow-in-down"></i> ENTRADA</button>
                        <button type="button" id="btnSalida" class="btn btn-pill btn-red"><i class="bi bi-box-arrow-up"></i> SALIDA</button>
                        <a id="btnEditar" href="#" class="btn btn-pill btn-blue"><i class="bi bi-pencil"></i> EDITAR</a>
                        <a href="inventario.html" class="btn btn-outline-dark rounded-pill">VOLVER</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="modalMov" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-sm">
                <div class="modal-content border-3 border-dark rounded-4">
                    <div class="modal-header"><h5 class="modal-title fw-bold" id="tituloMov"></h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
                    <div class="modal-body">
                        <label class="field-label" for="cantidadMov">Cantidad de unidades</label>
                        <input type="number" id="cantidadMov" class="form-control pill-field" min="1" step="1">
                    </div>
                    <div class="modal-footer"><button type="button" id="btnGuardarMov" class="btn btn-pill btn-green">GUARDAR</button></div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/detalle.js"></script>
</body>
</html>
