<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Historial de ventas | Deportes California</title>
    <link rel="icon" href="img/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dashboard-body" data-nav="historial">
    <main class="container-fluid p-3 p-md-4 dashboard-content">
        <div class="dash-banner mb-4">Historial de ventas</div>

        <div class="row g-3 mb-2 align-items-end">
            <div class="col-6 col-lg-3">
                <label class="field-label" for="fDesde">Desde</label>
                <input type="date" id="fDesde" class="form-control pill-field">
            </div>
            <div class="col-6 col-lg-3">
                <label class="field-label" for="fHasta">Hasta</label>
                <input type="date" id="fHasta" class="form-control pill-field">
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <label class="field-label" for="fMetodo">Método de pago</label>
                <select id="fMetodo" class="form-select pill-field">
                    <option value="" selected>Todos</option>
                    <option value="EFECTIVO">Efectivo</option>
                    <option value="TRANSFERENCIA">Transferencia</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <button type="button" id="btnLimpiar" class="btn btn-outline-dark w-100">Limpiar filtros</button>
            </div>
        </div>
        <div id="errorFechas" class="text-danger fw-semibold mb-3 d-none" role="alert">
            <i class="bi bi-exclamation-circle-fill" aria-hidden="true"></i> La fecha inicial no puede ser mayor que la fecha final.
        </div>

        <div class="row g-3 my-2 mb-3">
            <div class="col-12 col-sm-6">
                <div class="metric-card h-100">
                    <p class="metric-title mb-1">Ventas mostradas</p>
                    <span class="metric-value" id="resCantidad">-</span>
                </div>
            </div>
            <div class="col-12 col-sm-6">
                <div class="metric-card metric-ok h-100">
                    <p class="metric-title mb-1">Total vendido</p>
                    <span class="metric-value" id="resTotal">-</span>
                </div>
            </div>
        </div>

        <div class="table-card p-2 p-md-3">
            <div class="table-responsive">
                <table class="table align-middle text-center mb-0 custom-inv-table tabla-apilada">
                    <thead>
                        <tr><th>Folio</th><th>Fecha y hora</th><th>Vendedor</th><th>Método de pago</th><th>Artículos</th><th>Total</th><th>Acciones</th></tr>
                    </thead>
                    <tbody id="tablaVentas">
                        <tr><td colspan="7" class="text-muted py-4">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
            <div id="paginacionVentas"></div>
        </div>

        <div class="modal fade" id="modalVenta" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold" id="detalleTitulo">Detalle de la venta</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row g-2 mb-3">
                            <div class="col-6 col-md-3"><small class="text-muted d-block">Fecha y hora</small><b id="dvFecha"></b></div>
                            <div class="col-6 col-md-3"><small class="text-muted d-block">Vendedor</small><b id="dvVendedor"></b></div>
                            <div class="col-6 col-md-3"><small class="text-muted d-block">Método de pago</small><b id="dvMetodo"></b></div>
                            <div class="col-6 col-md-3"><small class="text-muted d-block">Artículos</small><b id="dvArticulos"></b></div>
                        </div>
                        <div class="table-responsive border rounded-3">
                            <table class="table table-sm mb-0 align-middle">
                                <thead class="table-light"><tr><th>Producto</th><th class="text-end">Cant.</th><th class="text-end">Precio</th><th class="text-end">Subtotal</th></tr></thead>
                                <tbody id="dvLineas"></tbody>
                            </table>
                        </div>
                        <div class="text-end fs-4 fw-bold mt-3">Total: <span id="dvTotal"></span></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/ventas.js"></script>
</body>
</html>
