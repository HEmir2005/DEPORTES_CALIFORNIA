<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar venta | Deportes California</title>
    <link rel="icon" href="img/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dashboard-body" data-nav="ventas">
    <main class="container-fluid p-3 p-md-4 dashboard-content">
        <div class="dash-banner mb-4">Registrar venta</div>

        <div class="row g-3">
            <div class="col-12 col-lg-7">
                <div class="sale-panel">
                    <div class="row g-2 mb-3">
                        <div class="col-12 col-sm-7">
                            <div class="custom-input-pill d-flex align-items-center">
                                <input type="text" id="inputBuscar" placeholder="Buscar..." class="form-control border-0 bg-transparent shadow-none">
                                <i class="bi bi-search ms-2 text-muted fs-5"></i>
                            </div>
                        </div>
                        <div class="col-12 col-sm-5">
                            <div class="custom-input-pill">
                                <select id="selectCategoria" class="form-select border-0 bg-transparent shadow-none"><option value="" selected>Categoría</option></select>
                            </div>
                        </div>
                    </div>
                    <div id="listaProductos"></div>
                    <div id="paginacionVenta"></div>
                </div>
            </div>

            <div class="col-12 col-lg-5">
                <div class="sale-panel d-flex flex-column">
                    <h2 class="h5 fw-bold text-center">Carrito de Venta</h2>
                    <div class="scroll-list flex-grow-1" id="itemsCarrito"></div>
                    <div class="d-flex justify-content-between align-items-center fw-bold fs-5 border-top border-2 border-dark pt-2 mt-2">
                        <span>Total</span><span id="totalCarrito">$0.00</span>
                    </div>
                    <button type="button" id="btnFinalizar" class="btn btn-pill btn-green mt-3 align-self-end" disabled>Finalizar venta</button>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/venta.js"></script>
</body>
</html>
