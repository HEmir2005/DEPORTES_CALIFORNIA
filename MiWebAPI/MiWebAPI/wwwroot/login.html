<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Deportes California</title>
    <link rel="icon" href="img/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-body">
    <header class="login-header">Deportes California</header>

    <main class="login-card">
        <img src="img/logo.png" alt="Deportes California" class="login-logo">
        <h1>Iniciar sesión</h1>

        <div id="mensajeLogin" class="alert alert-danger d-none" role="alert"></div>

        <form id="formLogin">
            <div class="mb-3">
                <label for="nombreUsuario" class="field-label">Usuario</label>
                <input type="text" id="nombreUsuario" class="form-control pill-field" required autocomplete="username">
            </div>
            <div class="mb-4">
                <label for="password" class="field-label">Contraseña</label>
                <input type="password" id="password" class="form-control pill-field" required autocomplete="current-password">
            </div>
            <button id="btnLogin" type="submit" class="btn btn-pill btn-blue">Acceder</button>
        </form>
    </main>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
