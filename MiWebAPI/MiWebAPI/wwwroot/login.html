<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deportes California - Acceder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="figma-login-body">
    <div class="login-card-figma">
        <header class="login-header">DEPORTES CALIFORNIA</header>

        <div class="figma-body">
            <img src="img/logo.png" alt="California Deportes" class="figma-logo">

            <div id="mensajeLogin" class="alert alert-danger d-none mb-3 w-100" style="max-width:450px" role="alert"></div>

            <form id="formLogin" class="figma-form">
                <div class="figma-input-group mb-3">
                    <input type="text" id="nombreUsuario" class="form-control" required placeholder="Usuario" autocomplete="username">
                </div>
                <div class="figma-input-group mb-4">
                    <input type="password" id="password" class="form-control" required placeholder="Contraseña" autocomplete="current-password">
                </div>
                <button id="btnLogin" type="submit" class="btn btn-primary btn-lg w-100">ACCEDER</button>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
