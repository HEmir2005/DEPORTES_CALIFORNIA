<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio | Deportes California</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dashboard-body" data-nav="home">
    <main class="container-fluid p-3 p-md-4 dashboard-content">
        <div class="row g-3">
            <div class="col-12 col-lg-6 d-flex flex-column gap-3">
                <div class="dash-banner">HOME - DASHBOARD</div>
                <div class="row g-3">
                    <div class="col-6">
                        <div class="metric-card d-flex justify-content-between align-items-center h-100">
                            <div>
                                <p class="metric-title mb-1">Total Productos:</p>
                                <span class="metric-value" id="totalProductos">-</span>
                            </div>
                            <i class="bi bi-box-seam metric-icon"></i>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="metric-card d-flex justify-content-between align-items-center h-100">
                            <div>
                                <p class="metric-title mb-1">Productos con Stock Bajo:</p>
                                <span class="metric-value" id="stockBajo">-</span>
                            </div>
                            <i class="bi bi-graph-down-arrow metric-icon text-danger"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-6">
                <div class="metric-card metric-card-lg h-100 d-flex flex-column justify-content-between">
                    <p class="metric-title fs-5 text-center text-lg-start mb-2">Productos Vendidos del día de Hoy:</p>
                    <div class="d-flex justify-content-around align-items-center my-3">
                        <span class="metric-value-lg" id="productosVendidosHoy">-</span>
                        <i class="bi bi-coin metric-icon-lg"></i>
                    </div>
                </div>
            </div>

            <div class="col-12 mt-3">
                <div class="metric-card p-3 p-md-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="h5 fw-bold mb-0">Últimos Movimientos:</h2>
                        <span class="fw-bold fs-6">Fecha:</span>
                    </div>
                    <div class="list-group list-group-flush movimientos-list" id="listaMovimientos"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
