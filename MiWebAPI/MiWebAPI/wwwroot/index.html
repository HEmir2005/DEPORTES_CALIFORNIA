<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio | Deportes California</title>
    <link rel="icon" href="img/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dashboard-body" data-nav="home">
    <main class="container-fluid p-3 p-md-4 dashboard-content">
        <div class="dash-banner mb-3">Panel principal</div>

        <div class="row g-3">
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="metric-card h-100">
                    <div class="d-flex justify-content-between align-items-start gap-2">
                        <p class="metric-title mb-2">Total de productos</p>
                        <i class="bi bi-box-seam metric-icon" aria-hidden="true"></i>
                    </div>
                    <span class="metric-value" id="totalProductos">-</span>
                    <div class="metric-nota">Unidades en existencia</div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="metric-card metric-alerta h-100">
                    <div class="d-flex justify-content-between align-items-start gap-2">
                        <p class="metric-title mb-2">Productos con stock bajo</p>
                        <i class="bi bi-exclamation-triangle metric-icon" aria-hidden="true"></i>
                    </div>
                    <span class="metric-value" id="stockBajo">-</span>
                    <div class="metric-nota">Con 5 unidades o menos</div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="metric-card metric-ok h-100">
                    <div class="d-flex justify-content-between align-items-start gap-2">
                        <p class="metric-title mb-2">Dinero vendido hoy</p>
                        <i class="bi bi-cash-stack metric-icon" aria-hidden="true"></i>
                    </div>
                    <span class="metric-value" id="ventasHoyMonto">-</span>
                    <div class="metric-nota" id="ventasHoyCantidad">&nbsp;</div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="metric-card metric-ok h-100">
                    <div class="d-flex justify-content-between align-items-start gap-2">
                        <p class="metric-title mb-2">Unidades vendidas hoy</p>
                        <i class="bi bi-bag-check metric-icon" aria-hidden="true"></i>
                    </div>
                    <span class="metric-value" id="productosVendidosHoy">-</span>
                    <div class="metric-nota">Productos entregados</div>
                </div>
            </div>

            <div class="col-12 mt-3">
                <div class="metric-card p-3 p-md-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="h5 fw-bold mb-0">Últimos movimientos</h2>
                        <span class="fw-bold fs-6">Fecha:</span>
                    </div>
                    <div class="list-group list-group-flush movimientos-list" id="listaMovimientos"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
