<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perfil | Deportes California</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dashboard-body" data-nav="">
    <main class="container-fluid p-3 p-md-4 dashboard-content">
        <div class="d-flex justify-content-between align-items-center gap-2 mb-4">
            <div class="dash-banner flex-grow-1 mb-0">GESTIÓN DEL PERFIL</div>
            <button type="button" id="btnCerrarSesion" class="btn btn-pill btn-blue text-nowrap">Cerrar sesión</button>
        </div>

        <div class="form-card mx-auto" style="max-width:640px">
            <div class="text-center mb-3"><img src="img/logo.png" alt="California Deportes" style="width:200px;max-width:70%"></div>

            <div class="perfil-fila">
                <div><small class="text-muted d-block">Usuario</small><b class="fs-5" id="perfilUsuario"></b> <span class="badge text-bg-secondary ms-1" id="perfilRol"></span></div>
                <button type="button" class="btn p-0 border-0" data-bs-toggle="modal" data-bs-target="#modalUsuario" aria-label="Cambiar usuario"><i class="bi bi-pencil fs-5"></i></button>
            </div>
            <div class="perfil-fila">
                <div><small class="text-muted d-block">Contraseña</small><b class="fs-5">••••••••</b></div>
                <button type="button" class="btn p-0 border-0" data-bs-toggle="modal" data-bs-target="#modalContrasena" aria-label="Cambiar contraseña"><i class="bi bi-pencil fs-5"></i></button>
            </div>
            <div class="text-center mt-4">
                <button type="button" class="btn btn-pill btn-blue" data-bs-toggle="modal" data-bs-target="#modalContrasena">Cambiar contraseña</button>
            </div>
        </div>

        <div class="modal fade" id="modalUsuario" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <form id="formUsuario" class="modal-content border-3 border-dark rounded-4">
                    <div class="modal-header"><h5 class="modal-title fw-bold">Cambiar nombre de usuario</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
                    <div class="modal-body d-flex flex-column gap-3">
                        <div><label class="field-label" for="nuevoNombre">Nuevo usuario</label><input id="nuevoNombre" class="form-control pill-field" required autocomplete="off"></div>
                        <div><label class="field-label" for="confirmaContrasena">Contraseña actual (para confirmar)</label><input id="confirmaContrasena" type="password" class="form-control pill-field" required autocomplete="current-password"></div>
                    </div>
                    <div class="modal-footer"><button type="submit" class="btn btn-pill btn-blue">Confirmar cambios</button></div>
                </form>
            </div>
        </div>

        <div class="modal fade" id="modalContrasena" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <form id="formContrasena" class="modal-content border-3 border-dark rounded-4">
                    <div class="modal-header"><h5 class="modal-title fw-bold">Cambiar contraseña</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
                    <div class="modal-body d-flex flex-column gap-3">
                        <div><label class="field-label" for="contrasenaActual">Contraseña actual</label><input id="contrasenaActual" type="password" class="form-control pill-field" required autocomplete="current-password"></div>
                        <div><label class="field-label" for="contrasenaNueva">Contraseña nueva</label><input id="contrasenaNueva" type="password" class="form-control pill-field" required minlength="6" autocomplete="new-password"></div>
                        <div><label class="field-label" for="contrasenaRepetida">Repite la contraseña</label><input id="contrasenaRepetida" type="password" class="form-control pill-field" required autocomplete="new-password"></div>
                    </div>
                    <div class="modal-footer"><button type="submit" class="btn btn-pill btn-blue">Confirmar</button></div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/perfil.js"></script>
</body>
</html>
