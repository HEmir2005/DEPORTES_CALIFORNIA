<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Producto | Deportes California</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dashboard-body" data-nav="inventario">
    <main class="container-fluid p-3 p-md-4 dashboard-content">
        <div class="dash-banner mb-4" id="tituloForm">REGISTRO PRODUCTOS</div>

        <form id="formProducto" class="form-card" novalidate>
            <div class="row g-4">
                <div class="col-12 col-md-8">
                    <div class="row g-3">
                        <div class="col-12 col-sm-6">
                            <label class="field-label" for="sku">SKU / Código</label>
                            <input class="form-control pill-field" id="sku" name="sku" maxlength="30" required>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="field-label" for="nombre">Nombre del producto</label>
                            <input class="form-control pill-field" id="nombre" name="nombre" maxlength="100" required>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="field-label" for="idCategoria">Categoría</label>
                            <select class="form-select pill-field" id="idCategoria" name="idCategoria" required></select>
                        </div>
                        <div class="col-6 col-sm-3">
                            <label class="field-label" for="talla">Talla</label>
                            <input class="form-control pill-field" id="talla" name="talla" maxlength="20">
                        </div>
                        <div class="col-6 col-sm-3">
                            <label class="field-label" for="color">Color</label>
                            <input class="form-control pill-field" id="color" name="color" maxlength="40">
                        </div>
                        <div class="col-6">
                            <label class="field-label" for="precio">Precio</label>
                            <input class="form-control pill-field" id="precio" name="precio" type="number" min="0" step="0.01" required>
                        </div>
                        <div class="col-6">
                            <label class="field-label" for="stock">Unidades</label>
                            <input class="form-control pill-field" id="stock" name="stock" type="number" min="0" step="1" value="0" required>
                        </div>
                        <div class="col-12">
                            <label class="field-label" for="descripcion">Descripción</label>
                            <textarea class="form-control pill-field" id="descripcion" name="descripcion" rows="3" maxlength="500"></textarea>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-md-4 d-flex flex-column align-items-center">
                    <span class="field-label">Imagen</span>
                    <label class="img-preview" id="imgPreview" for="imagen">
                        <span><i class="bi bi-upload fs-3 d-block"></i>Subir archivo</span>
                    </label>
                    <input type="file" id="imagen" name="imagen" accept="image/png,image/jpeg,image/webp" class="d-none">
                    <small class="text-muted mt-2">JPG, PNG o WEBP. Máximo 2 MB.</small>
                </div>
            </div>

            <div class="d-flex flex-wrap justify-content-center gap-3 mt-4">
                <button type="submit" id="btnGuardar" class="btn btn-pill btn-green px-5">GUARDAR</button>
                <a href="inventario.html" class="btn btn-pill btn-red px-5">CANCELAR</a>
                <button type="button" id="btnEliminar" class="btn btn-outline-danger rounded-pill d-none">ELIMINAR PRODUCTO</button>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/producto-form.js"></script>
</body>
</html>
