<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Producto | Deportes California</title>
    <link rel="icon" href="img/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dashboard-body" data-nav="inventario">
    <main class="container-fluid p-3 p-md-4 dashboard-content">
        <div class="dash-banner mb-4" id="tituloForm">Registrar producto</div>

        <form id="formProducto" class="form-card" novalidate>
            <div id="errorForm" class="alert alert-danger d-none" role="alert"></div>

            <div class="row g-4">
                <div class="col-12 col-md-8">
                    <div class="row g-3">
                        <div class="col-12 col-sm-6">
                            <label class="field-label" for="sku">Código (SKU) *</label>
                            <input class="form-control pill-field" id="sku" name="sku" maxlength="30" autocomplete="off" required>
                            <div class="invalid-feedback"></div>
                            <div class="form-text">Usa un código distinto por cada talla y color. Ejemplo: TENIS-AIR-10-GRIS</div>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="field-label" for="nombre">Nombre del producto *</label>
                            <input class="form-control pill-field" id="nombre" name="nombre" maxlength="150" required>
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="field-label" for="idCategoria">Categoría *</label>
                            <select class="form-select pill-field" id="idCategoria" name="idCategoria" required></select>
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-6 col-sm-3">
                            <label class="field-label" for="talla">Talla</label>
                            <input class="form-control pill-field" id="talla" name="talla" maxlength="10">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-6 col-sm-3">
                            <label class="field-label" for="color">Color</label>
                            <input class="form-control pill-field" id="color" name="color" maxlength="30">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-6">
                            <label class="field-label" for="precio">Precio (MXN) *</label>
                            <input class="form-control pill-field" id="precio" name="precio" type="number" min="0.01" max="99999999" step="0.01" inputmode="decimal" required>
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-6">
                            <label class="field-label" for="stock">Unidades *</label>
                            <input class="form-control pill-field" id="stock" name="stock" type="number" min="0" max="100000" step="1" inputmode="numeric" value="0" required>
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-12">
                            <label class="field-label" for="descripcion">Descripción</label>
                            <textarea class="form-control pill-field" id="descripcion" name="descripcion" rows="3" maxlength="500"></textarea>
                        </div>
                    </div>
                    <p class="text-muted small mt-3 mb-0">Los campos con * son obligatorios.</p>
                </div>

                <div class="col-12 col-md-4 d-flex flex-column align-items-center">
                    <span class="field-label">Imagen</span>
                    <label class="img-preview" id="imgPreview" for="imagen">
                        <span><i class="bi bi-upload fs-3 d-block"></i>Subir archivo</span>
                    </label>
                    <input type="file" id="imagen" name="imagen" accept="image/png,image/jpeg,image/webp" class="d-none">
                    <small class="text-muted mt-2">JPG, PNG o WEBP. La foto se ajusta sola.</small>
                </div>
            </div>

            <div class="d-flex flex-wrap justify-content-center gap-3 mt-4">
                <button type="submit" id="btnGuardar" class="btn btn-pill btn-green px-5">Guardar</button>
                <a href="inventario.html" class="btn btn-pill btn-red px-5">Cancelar</a>
                <button type="button" id="btnEliminar" class="btn btn-outline-danger d-none">Dar de baja</button>
            </div>
        </form>

        <div class="modal fade" id="modalExito" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content text-center p-3">
                    <i class="bi bi-check-circle-fill text-success" style="font-size:3.5rem" aria-hidden="true"></i>
                    <h2 class="h4 fw-bold" id="exitoTitulo"></h2>
                    <p id="exitoMensaje" class="mb-3"></p>
                    <div id="exitoFicha" class="exito-ficha mb-3 d-none">
                        <div id="exitoImagen"></div>
                        <div>
                            <div class="fw-bold fs-5" id="exitoNombre"></div>
                            <div class="small" id="exitoDatos"></div>
                        </div>
                    </div>
                    <div class="d-flex flex-wrap justify-content-center gap-2">
                        <a href="producto-form.html" class="btn btn-pill btn-green">Agregar otro producto</a>
                        <a id="exitoVer" href="#" class="btn btn-pill btn-blue">Ver el producto</a>
                        <a href="inventario.html" class="btn btn-outline-dark">Ir al inventario</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/producto-form.js"></script>
</body>
</html>
